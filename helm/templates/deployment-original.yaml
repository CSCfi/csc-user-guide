{{- $resourcename := include "docs-csc.origName" . -}}
{{- $servername := include "docs-csc.origServerName" . -}}
{{- $imagename := $resourcename | list $ | include "docs-csc.latestImageName" -}}
{{- $componentlabels := $resourcename | list $ | include "docs-csc.componentLabels" -}}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "docs-csc.origName" . }}
  labels:
{{ include "docs-csc.labels" . | indent 4 }}
{{ $componentlabels | indent 4 }}
  annotations:
    image.openshift.io/triggers: |-
{{ list $imagename $servername | include "docs-csc.deploymentTrigger" | indent 6 }}
spec:
  selector:
    matchLabels:
{{ include "docs-csc.selectorLabels" . | indent 6 }}
{{ $componentlabels | indent 6 }}
  replicas: {{ .Values.components.original.replicaCount | default 1 }}
  template:
    metadata:
      labels:
{{ include "docs-csc.labels" . | indent 8 }}
{{ $componentlabels | indent 8 }}
    spec:
      containers:
        - name: {{ $servername }}
          image: {{ $imagename | squote }}
          ports:
            - containerPort: 8000
              protocol: TCP
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%