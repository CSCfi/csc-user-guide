{{- $resourcename := include "docs-csc.osAppCredSecretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "docs-csc.labels" $ | indent 4 }}
{{ $resourcename | list $ | include "docs-csc.componentLabels" | indent 4 }}
type: Opaque
data:
{{- if .Values.os.useResourceLookup | default false }}
{{ lookup "v1"
          "Secret"
          .Release.Namespace
          $resourcename
   | dig "data" ""
   | required "OS Secret lookup failed!"
   | toYamlPretty
   | indent 2 }}
{{- else }}
{{- $data := .Values.os.secretsFile
             | required "os.secretsFile not provided!"
             | .Files.Get
             | fromYaml -}}
{{- list $data
         "os.applicationCredential.id"
         "os.applicationCredential.secret"
    | include "docs-csc.requireKeysEnc"
    | indent 2 }}
{{- end }}
