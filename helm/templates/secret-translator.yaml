{{- $resourcename := include "translation.translatorSecretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "docs-csc.labels" $ | indent 4 }}
{{ $resourcename | list $ | include "docs-csc.componentLabels" | indent 4 }}
type: Opaque
data:
{{- if .Values.components.translator.useResourceLookup | default false }}
{{ lookup "v1"
          "Secret"
          .Release.Namespace
          $resourcename
   | dig "data" ""
   | required "Translator Secret lookup failed!"
   | toYamlPretty
   | indent 2 }}
{{- else }}
{{- $data := .Values.components.translator.secretsFile
             | required "components.translator.secretsFile not provided!"
             | .Files.Get
             | fromYaml -}}
{{- $requiredkeys := list "translator.openAi.apiKey"
                          "translator.restic.password" -}}
{{- .Values.components.translator.restoreOnly
    | default false
    | ternary (without $requiredkeys "translator.openAi.apiKey")
              $requiredkeys
    | concat (list $data)
    | include "docs-csc.requireKeysEnc"
    | indent 2 }}
{{- end }}