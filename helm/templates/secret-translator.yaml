{{- if .Values.components.translator.useResourceLookup | default false }}
{{ lookup "v1"
          "Secret"
          .Release.Namespace
          (include "translation.translatorSecretName" .)
   | dig "data" dict
   | list $
   | include "translation.translatorSecret" }}
{{- else }}
{{ include "translation.newTranslatorSecret" . }}
{{- end }}