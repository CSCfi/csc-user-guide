{{- if not (include "networking.siteHost" . | hasSuffix ".rahtiapp.fi") }}
{{- $resourcename := include "networking.acmeEabSecretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "docs-csc.labels" . | indent 4 }}
{{ $resourcename | list $ | include "docs-csc.componentLabels" | indent 4 }}
type: Opaque
data:
{{- if .Values.site.acme.useResourceLookup | default false }}
{{ lookup "v1"
          "Secret"
          .Release.Namespace
          $resourcename
   | dig "data" ""
   | required "EAB Secret lookup failed!"
   | toYamlPretty
   | indent 2 }}
{{- else }}
{{- $data := include "networking.acmeFile" . | fromYaml -}}
{{- list $data
         "kid"
         "hmac"
    | include "docs-csc.requireKeysEnc"
    | indent 2 }}
{{- end }}
{{- end }}