{{- $resourcename := include "docs-csc.backupsSecretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "docs-csc.labels" $ | indent 4 }}
{{ $resourcename | list $ | include "docs-csc.componentLabels" | indent 4 }}
type: Opaque
data:
{{- if .Values.components.backups.useResourceLookup | default false }}
{{ lookup "v1"
          "Secret"
          .Release.Namespace
          $resourcename
   | dig "data" ""
   | required "Backups Secret lookup failed!"
   | toYamlPretty
   | indent 2 }}
{{- else }}
{{- $data := .Values.components.backups.secretsFile
             | required "components.backups.secretsFile not provided!"
             | .Files.Get 
             | fromYaml -}}
{{- list $data
         "backups.restic.password"
    | include "docs-csc.requireKeysEnc"
    | indent 2 }}
{{- end }}