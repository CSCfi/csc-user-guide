{{- $buildername := include "docs-csc.origBuilderName" . -}}
{{- $basename := include "docs-csc.baseName" . -}}
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: {{ $buildername }}
  labels:
{{ include "docs-csc.labels" . | indent 4 }}
{{ include "docs-csc.origName" . | list $ | include "docs-csc.componentLabels" | indent 4 }}
spec:
  triggers:
    - type: ImageChange
      imageChange:
        from:
          kind: ImageStreamTag
          name: {{ $basename | list $ | include "docs-csc.latestImageName" | squote }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ $buildername | list $ | include "docs-csc.latestImageName" | squote }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.builder
      buildArgs:
        - name: base_image
          value: {{ $basename | list $ | include "docs-csc.fullImageName" | squote }}
  source:
{{ include "docs-csc.gitSource" . | indent 4 }}