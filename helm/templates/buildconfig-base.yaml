{{- $resourcename := include "docs-csc.baseName" . -}}
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "docs-csc.labels" . | indent 4 }}
{{ $resourcename | list $ | include "docs-csc.componentLabels" | indent 4 }}
spec:
  triggers:
    - type: ConfigChange
  output:
    to:
      kind: ImageStreamTag
      name: {{ $resourcename | list $ | include "docs-csc.latestImageName" | squote }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.base
      buildArgs:
        - name: base_image
{{- with .Values.base }}
          value: {{ .tag | printf "%s:%s" .image | squote }}
{{- end }}
  source:
{{ include "docs-csc.gitSource" . | indent 4 }}