{{- $sitehost := include "networking.siteHost" . -}}
{{- $redundanthost := include "networking.redundantHost" . -}}
{{- $origservicename := include "docs-csc.origName" . }}
{{- $altservicename := include "docs-csc.altName" . -}}
{{- $languages := .Values.components.translator.languages -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
{{ include "networking.redundantIngressName" . | list $ | include "networking.ingressMetadata" | indent 2 }}
spec:
  rules:
{{ dict "host" $redundanthost
         "origServiceName" $origservicename
         "altServiceName" $altservicename
         "languages" $languages
    | include "networking.ingressRules" | indent 4 -}}
{{- if not ($sitehost | hasSuffix ".rahtiapp.fi") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
{{ include "networking.domainIngressName" . | list $ | include "networking.ingressMetadata" | indent 2 }}
spec:
  rules:
{{ dict "host" $sitehost
         "origServiceName" $origservicename
         "altServiceName" $altservicename
         "languages" $languages
    | include "networking.ingressRules" | indent 4 }}
  tls:
    - hosts:
        - {{ $sitehost }}
      secretName: {{ include "networking.domainTlsSecretName" . }}
{{- end }}