{{- $resourcename := include "docs-csc.altBuilderName" . -}}
{{- $origbuildername := include "docs-csc.origBuilderName" . -}}
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "docs-csc.labels" . | indent 4 }}
{{ $resourcename | list $ | include "docs-csc.componentLabels" | indent 4 }}
spec:
  triggers:
    - type: ImageChange
      imageChange:
        from:
          kind: ImageStreamTag
          name: {{ $origbuildername | printf "%s:latest" | squote }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ $resourcename | printf "%s:latest" | squote }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: translation/Containerfile.alternate.builder
      buildArgs:
        - name: builder_image
          value: {{ $origbuildername | list $ | include "docs-csc.fullImageName" | squote }}
{{- .Values.components.alternate.repo | default dict | include "docs-csc.repoOverride" | indent 8 }}
  source:
{{ include "docs-csc.gitSource" . | indent 4 }}