git:
  uri: https://github.com/CSCfi/csc-user-guide.git
  ref: master

# Defaults to 'preview' if not set:
environment: production

nameOverride: null

# Defaults to Etc/UTC:
timeZone: Europe/Helsinki

base:
  image: ubi9/ubi-minimal
  tag:  9.8-1791898448

builder:
  image: ubi9/python-312
  tag: 9.8-1791998425

server:
  image: ubi9/nginx-126
  tag: 9.8-1792401364

restic:
  image: ghcr.io/restic/restic
  tag: 0.19.1

localRegistry: image-registry.openshift-image-registry.svc:5000

# OpenStack Authentication
os:
  authUrl: https://pouta.csc.fi:5001/v3

  # OS Application Credential secrets file. Format is
  #   os.applicationCredential.id: <OS Application Credential ID>
  #   os.applicationCredential.secret: <OS Application Credential Secret>
  #
  # Has no effect if useResourceLookup is set. Keys are case-sensitive:
  secretsFile: os.yaml

  # Attempt to lookup existing OpenStack Secret in the namespace.
  useResourceLookup: false

site:
  # The server hostname. Alternate languages will be available
  # under subpaths /<lang code>. Defaults to <expanded chart name>.rahtiapp.fi:
  host: docs.csc.fi

  matomoUrl: https://mwa-acf.2.rahtiapp.fi/

  # List of IP addresses/ranges to allow access from. For example
  # - 127.0.0.1
  # - 192.167.0.0/16
  #
  # Allow any if empty. Has no effect if useAllowlistLookup is true.
  # Keys are case-sensitive:
  ipAllowlist: []

  # Attempt to lookup ipAllowlist from Ingress(es) on cluster.
  useAllowlistLookup: false

  acme:
    # Required if a custom certificate is needed, i.e. site.host
    # is set and does not end in '.rahtiapp.fi':
    issuerName: null

    # Replace email and server with actual values unless using useResourceLookup:
    email: recipient@example.org
    server: https://acme.api.example.org
    certificate:
      duration: 2160h
      renewBefore: 720h

    # ACME EAB secrets file. Format is
    #   kid: <ACME account EAB key ID>
    #   hmac: <ACME account EAB HMAC key>
    #
    # Has no effect if site.host is not set or ends in '.rahtiapp.fi',
    # or if useResourceLookup is true. Keys are case-sensitive:
    secretsFile: eab.yaml

    # Attempt to lookup existing ACME resources in the namespace.
    # Requires issuerName to be defined:
    useResourceLookup: false

components:
  original:
    # Git repo for the English site.
    # (defaults are defined in /Containerfile):
    repo:
      host: github.com
      org: CSCfi
      name: csc-user-guide
      branch: master

    # Matomo site ID for the English site:
    matomoSiteId: 1

    # Number of replicas for English site deployment,
    # Defaults to 1 if not set:
    replicaCount: 3

  translator:
    # Git repo where Markdown files are cloned from for translation.
    # (defaults are defined in /translation/Containerfile.translator):
    repo:
      host: github.com
      org: CSCfi
      name: csc-user-guide
      branch: master

    # Clone the translator config files
    #   - /translation/exclude.txt
    #   - /translation/force.yml
    #   - /translation/dictionary.yml
    #
    # from this branch instead of repo.branch:
    configBranchOverride: null

    # Translator secrets. Format is
    #   translator.openAi.apiKey: <string> (not needed if translator.restoreOnly is set)
    #   translator.restic.password: <string>
    #
    # Has no effect if useResourceLookup is true. Keys are case-sensitive:
    secretsFile: translator.yaml

    # Attempt to lookup existing translator Secret in the namespace.
    useResourceLookup: false

    languages:
      - code: fi
        name: Finnish
        matomoSiteId: 24

        # Suspend scheduled translation for language if needed:
        suspend: false
      # - code: se
      #   name: Swedish
      #   matomoSiteId: ??

    # Allows for a deployment where pages are not translated,
    # but only restored from the latest restic snapshot.
    # If set to true, translator.openAi.apiKey is not needed in secretsFile.
    # Defaults to false:
    restoreOnly: false

    # The translation schedule as cron expression.
    # Defaults to '0 0 * * 1-5', i.e. weekday midnights:
    schedule: 0 0 * * 1-5

    restic:
      repository: swift:docs-restic:/translations
      # This is not the server hostname. Only used as the hostname in restic snapshots:
      host: docs.csc.fi

    # This probably shouldn't be touched. Determines the path where
    # the translated files are cached before they're saved into
    # a restic snapshot. Used for continuing an errored translation
    # without having to start over:
    cache:
      container: docs-restic
      prefix: cache

    # Defaults to 2Gi if not set:
    storageCapacity: null

  alternate:
    # Git repo where non-Markdown files are cloned from for translated builds.
    # (defaults are defined in /translation/Containerfile.alternate.builder):
    repo:
      host: github.com
      org: CSCfi
      name: csc-user-guide
      branch: master

    # Clone ProperDocs config files
    #   - /properdocs.yml
    #   - /properdocs_*.yml
    # from this branch instead of repo.branch:
    configBranchOverride: null

    # Number of replicas for translated sites deployment,
    # Defaults to 1 if not set:
    replicaCount: 1

  backups:
    # Git repo to be backed up to a restic repository according to backup.schedule:
    # (defaults are defined in /backups/Containerfile.backups):
    repo:
      host: github.com
      org: CSCfi
      name: csc-user-guide

    # Suspend scheduled backups if needed:
    suspend: false

    # The backup schedule as cron expression.
    # Defaults to '0 23 * * 1-5', i.e. weekdays at 23:00:
    schedule: 0 23 * * 1-5

    restic:
      repository: swift:docs-restic:/backups
      # This is not the server hostname. Only used as the hostname in restic snapshots:
      host: docs.csc.fi

    # Backups secrets. Format is
    #   backups.restic.password: <string>
    #
    # Has no effect if useResourceLookup is true. Keys are case-sensitive:
    secretsFile: backups.yaml

    # Attempt to lookup existing backups Secret in the namespace.
    useResourceLookup: false

  probes:
    git:
      uri: https://github.com/CSCfi/broken-link-s2i.git
      ref: main

    # Suspend scheduled probes if needed:
    suspend: false

    # The probes schedule as cron expression.
    # Defaults to '0 3 2 * *', i.e. every 2nd day of the month at 03:00:
    schedule: 0 3 2 * *

    siteUrlOverride: null

    # Email report not sent if these are not set. Has no effect is useResourceLookup is true.
    email:
      sender: sender@example.org
      recipient: recipient@example.org
      smtp: smtp.example.org

    # Attempt to lookup existing probes ConfigMap in the namespace.
    useResourceLookup: false

    # Send email report in Markdown format:
    markdown: true

    # Source-to-Image builder:
    sourceFrom:
      image: python
      tag: 3.12-ubi9
      namespace: openshift