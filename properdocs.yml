markdown_extensions:
  - md_in_html
  - footnotes
  - admonition
  - abbr
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      base_path:
        - includes/snippets
        - docs/data/sensitive-data
      auto_append:
        - glossaries/hpc.md
        - glossaries/cloud.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

theme:
  name: materialx
  language: en-CSC
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/logo.png
  icon:
    repo: material/git
    edit: material/pencil
    view: material/eye
    alternate: material/chevron-down
  admonition:
    note:
      icon: null
      color: "var(--docs-note-color)"
    default:
      icon: null
      color: "var(--c-primary-600)"
    info:
      icon: material/information
      color: "var(--c-info-600)"
    success:
      icon: material/check-circle
      color: "var(--c-success-600)"
    warning:
      icon: material/alert
      color: "var(--c-warning-600)"
    error:
      icon: material/close-circle
      color: "var(--c-error-600)"
    training:
      icon: fontawesome/solid/chalkboard-user
      color: "var(--c-secondary-600)"
  palette:
    scheme: docs-ui
    primary: custom
    accent: custom
  font: false # No loading fonts from G****e
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - navigation.path

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js
  - assets/javascripts/feedback.js

# See https://properdocs.org/user-guide/configuration/#validation
