site_name: Docs CSC
site_url: !ENV [SITE_URL, "https://docs.csc.fi"]
site_description: Instructions and user guides for the CSC supercomputers, cloud services, storage and software, including FAQ and tutorials

repo_name: CSCfi/csc-user-guide
repo_url: https://github.com/CSCfi/csc-user-guide/
edit_uri: edit/master/docs/

docs_dir: !ENV [DOCS_DIR, "docs"]

extra:
  environment: !ENV [PROPERDOCS_ENV, "preview"]
  announcement: # An announcement shown below the header
    icon:
      name: material/coffee # Choose one (emojis not supported) from here https://jaywhj.github.io/mkdocs-materialx/reference/icons-emojis.html#search
      mirror: false # Toggle mirrored right-hand side icon
    color_scheme: info # Choose one from here https://design-system.csc.fi/design-tokens/color (null for default color)
    content: |- # Make sure to also update the translation in mkdocs_fi.yml
      <p>Welcome to our weekly research support coffee hour on Zoom! <a href="https://csc.fi/en/training-calendar/csc-research-support-coffee-every-wednesday-at-1400-finnish-time-2-2/" target="_blank">Click here for more information.</a></p>
    visible: false
  landing_banner:
    path: https://a3s.fi/docs-files/banners/ # Put the image file in this bucket; Don't touch this value.
    image: roihu-new.png
    title: Roihu supercomputer – get started here!
    link: support/tutorials/roihu/
    description: |-
      Roihu is CSC's national supercomputer, replacing the retired Puhti and Mahti systems and offering enhanced performance and capabilities.
    visible: true
  analytics:
    provider: custom
    matomo_site_id: !ENV [MATOMO_SITE_ID, ""]
    matomo_url: !ENV [MATOMO_URL, ""]
    feedback:
      title: Do you find this page useful?
      ratings:
        - name: "Yes"
          type: Positive
          description: Yes! I do find this page useful.
          note: >-
            Thank you for your feedback!
        - name: "No"
          type: Negative
          description: No! This page needs to be improved.
          note: >-
            Thank you! Your feedback is appreciated.
      exclude:
        - ref.md
  short_description: User guides and tutorials
  social:
    - icon: material/github
      link: https://github.com/CSCfi/
    - icon: material/linkedin
      link: https://www.linkedin.com/company/csc---it-center-for-science/
    - icon: material/instagram
      link: https://www.instagram.com/CSCfi/
    - icon: material/facebook
      link: https://www.facebook.com/CSCfi/
    - icon: material/youtube
      link: https://www.youtube.com/c/CSCfi
  alternate:
    - name: In English
      link: /
      lang: en
    - name: Suomeksi (tekoäly)
      link: /fi/
      lang: fi

hooks:
  - hooks/catalog.py
  - hooks/archives.py
  - hooks/preview.py
  - hooks/testing.py
  - hooks/whats-new.py
  - hooks/glossary.py
  - hooks/breadcrumbs.py

watch:
  - hooks
  - includes
  - overrides

plugins:
  tags:
    tags_allowed:
      - "Academic"
      - "Free"
      - "Non-commercial"
      - "Other"
  search: {}
  section-index: {}
  literate-nav:
    nav_file: NAV.md
    implicit_index: true
    tab_length: 4
  git-revision-date-localized:
    enabled: !ENV [ENABLED_GIT_REVISION_DATE, true]
    fallback_to_build_date: true
    ignored_commits_file: .git-revision-date-ignore-revs
    type: date
    custom_format: "%Y-%m-%dT%H:%M:%S%z" # Used with feedback buttons
    locale: en
    timezone: Europe/Helsinki
    exclude:
      - index.md
      - support/archives/*.md
      - support/glossary.md
      - support/whats-new.md
      - apps/index.md
      - apps/by_discipline.md
      - apps/by_availability.md
      - apps/by_license.md
      - NAV.md
      - '**/NAV.md'
